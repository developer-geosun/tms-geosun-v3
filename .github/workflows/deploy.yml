# Деплой Angular (корінь) + Flutter Web (/flutter/) на GitHub Pages через офіційний workflow.
# GitHub Pages: Settings → Pages → Source: GitHub Actions.
# API — окремо (ngrok або статична IP, див. PUBLIC_ACCESS_MODE).
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
    paths:
      - "frontend-angular/**"
      - "frontend-flutter/**"
      - ".github/workflows/deploy.yml"
      - ".github/pages-404.html"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARTO_API_KEY_SECRET_NAME: CARTO_API_KEY
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Pages base paths
        id: pages
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          echo "repo_name=${REPO_NAME}" >> "$GITHUB_OUTPUT"
          echo "angular_base_href=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
          echo "flutter_base_href=/${REPO_NAME}/flutter/" >> "$GITHUB_OUTPUT"
          echo "Angular base-href=/${REPO_NAME}/"
          echo "Flutter base-href=/${REPO_NAME}/flutter/"

      - name: Install Angular dependencies
        working-directory: frontend-angular
        run: npm ci --legacy-peer-deps

      - name: Build Angular application
        working-directory: frontend-angular
        run: npx ng build --configuration=production --base-href=${{ steps.pages.outputs.angular_base_href }}

      - name: Inject runtime API config for Angular (GitHub Pages)
        env:
          API_URL: ${{ secrets.API_URL }}
          CARTO_API_KEY: ${{ secrets[env.CARTO_API_KEY_SECRET_NAME] }}
        run: |
          set -e
          DIST="frontend-angular/dist/tms-geosun"
          CONFIG="$DIST/assets/app-config.js"
          if [ ! -f "$CONFIG" ]; then
            echo "Error: $CONFIG not found"
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const configPath = 'frontend-angular/dist/tms-geosun/assets/app-config.js';
          const apiUrl = (process.env.API_URL || '').trim().replace(/\/+$/, '');
          const cartoApiKey = (process.env.CARTO_API_KEY || '').trim();
          let content = fs.readFileSync(configPath, 'utf8');
          if (apiUrl) {
            if (/apiUrl\s*:/.test(content)) {
              content = content.replace(/apiUrl\s*:\s*[^,\n]+/, `apiUrl: ${JSON.stringify(apiUrl)}`);
            } else {
              content = content.replace(
                /window\.__APP_CONFIG__\s*=\s*\{/,
                `window.__APP_CONFIG__ = {\n  apiUrl: ${JSON.stringify(apiUrl)},`
              );
            }
          } else {
            console.warn('Warning: secrets.API_URL is empty — Angular will use relative API URLs');
          }
          if (cartoApiKey) {
            if (/cartoApiKey\s*:/.test(content)) {
              content = content.replace(/cartoApiKey\s*:\s*[^,\n]+/, `cartoApiKey: ${JSON.stringify(cartoApiKey)}`);
            } else {
              content = content.replace(
                /window\.__APP_CONFIG__\s*=\s*\{/,
                `window.__APP_CONFIG__ = {\n  cartoApiKey: ${JSON.stringify(cartoApiKey)},`
              );
            }
          } else {
            console.warn('Warning: secrets.CARTO_API_KEY is empty — CARTO tiles will show API KEY REQUIRED watermark');
          }
          fs.writeFileSync(configPath, content, 'utf8');
          console.log('Angular runtime config updated for GitHub Pages deploy');
          NODE

      - name: Build Flutter Web application
        working-directory: frontend-flutter
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          set -e
          flutter pub get
          API_DEFINE="${API_URL:-http://localhost:8080}"
          API_DEFINE="${API_DEFINE%/}"
          if [ -z "${API_URL}" ]; then
            echo "Warning: secrets.API_URL is empty — Flutter will use default API URL at build time"
          fi
          flutter build web --release \
            --base-href="${{ steps.pages.outputs.flutter_base_href }}" \
            --dart-define=API_URL="${API_DEFINE}"

      - name: Prepare GitHub Pages artifact
        run: |
          set -e
          ANGULAR_DIST="frontend-angular/dist/tms-geosun"
          FLUTTER_DIST="frontend-flutter/build/web"
          if [ ! -d "$ANGULAR_DIST" ]; then
            echo "Error: $ANGULAR_DIST directory not found"
            exit 1
          fi
          if [ ! -d "$FLUTTER_DIST" ]; then
            echo "Error: $FLUTTER_DIST directory not found"
            exit 1
          fi
          mkdir -p site-output/flutter
          cp -r "$ANGULAR_DIST"/* site-output/
          cp -r "$FLUTTER_DIST"/* site-output/flutter/
          cp .github/pages-404.html site-output/404.html
          touch site-output/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
