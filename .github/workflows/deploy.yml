# Деплой Angular (корінь) + Flutter Web (/flutter/) на gh-pages
# GitHub Pages: Settings → Pages → branch gh-pages / root
# API — окремо (ngrok або статична IP, див. PUBLIC_ACCESS_MODE).
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
    paths:
      - "frontend-angular/**"
      - "frontend-flutter/**"
      - ".github/workflows/deploy.yml"
      - ".github/pages-404.html"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CARTO_API_KEY_SECRET_NAME: CARTO_API_KEY
    permissions:
      contents: write

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Pages base paths
        id: pages
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          echo "repo_name=${REPO_NAME}" >> "$GITHUB_OUTPUT"
          echo "angular_base_href=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
          echo "flutter_base_href=/${REPO_NAME}/flutter/" >> "$GITHUB_OUTPUT"
          echo "Angular base-href=/${REPO_NAME}/"
          echo "Flutter base-href=/${REPO_NAME}/flutter/"

      - name: Install Angular dependencies
        working-directory: frontend-angular
        run: npm ci --legacy-peer-deps

      - name: Build Angular application
        working-directory: frontend-angular
        run: npx ng build --configuration=production --base-href=${{ steps.pages.outputs.angular_base_href }}

      - name: Inject runtime API config for Angular (GitHub Pages)
        env:
          API_URL: ${{ secrets.API_URL }}
          CARTO_API_KEY: ${{ secrets[env.CARTO_API_KEY_SECRET_NAME] }}
        run: |
          set -e
          DIST="frontend-angular/dist/tms-geosun"
          CONFIG="$DIST/assets/app-config.js"
          if [ ! -f "$CONFIG" ]; then
            echo "Error: $CONFIG not found"
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const configPath = 'frontend-angular/dist/tms-geosun/assets/app-config.js';
          const apiUrl = (process.env.API_URL || '').trim().replace(/\/+$/, '');
          const cartoApiKey = (process.env.CARTO_API_KEY || '').trim();
          let content = fs.readFileSync(configPath, 'utf8');
          if (apiUrl) {
            if (/apiUrl\s*:/.test(content)) {
              content = content.replace(/apiUrl\s*:\s*[^,\n]+/, `apiUrl: ${JSON.stringify(apiUrl)}`);
            } else {
              content = content.replace(
                /window\.__APP_CONFIG__\s*=\s*\{/,
                `window.__APP_CONFIG__ = {\n  apiUrl: ${JSON.stringify(apiUrl)},`
              );
            }
          } else {
            console.warn('Warning: secrets.API_URL is empty — Angular will use relative API URLs');
          }
          if (cartoApiKey) {
            if (/cartoApiKey\s*:/.test(content)) {
              content = content.replace(/cartoApiKey\s*:\s*[^,\n]+/, `cartoApiKey: ${JSON.stringify(cartoApiKey)}`);
            } else {
              content = content.replace(
                /window\.__APP_CONFIG__\s*=\s*\{/,
                `window.__APP_CONFIG__ = {\n  cartoApiKey: ${JSON.stringify(cartoApiKey)},`
              );
            }
          } else {
            console.warn('Warning: secrets.CARTO_API_KEY is empty — CARTO tiles will show API KEY REQUIRED watermark');
          }
          fs.writeFileSync(configPath, content, 'utf8');
          console.log('Angular runtime config updated for GitHub Pages deploy');
          NODE

      - name: Build Flutter Web application
        working-directory: frontend-flutter
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          set -e
          flutter pub get
          API_DEFINE="${API_URL:-http://localhost:8080}"
          API_DEFINE="${API_DEFINE%/}"
          if [ -z "${API_URL}" ]; then
            echo "Warning: secrets.API_URL is empty — Flutter will use default API URL at build time"
          fi
          flutter build web --release \
            --base-href="${{ steps.pages.outputs.flutter_base_href }}" \
            --dart-define=API_URL="${API_DEFINE}"

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to GitHub Pages
        env:
          DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ANGULAR_DIST="frontend-angular/dist/tms-geosun"
          FLUTTER_DIST="frontend-flutter/build/web"
          if [ ! -d "$ANGULAR_DIST" ]; then
            echo "Error: $ANGULAR_DIST directory not found"
            exit 1
          fi
          if [ ! -d "$FLUTTER_DIST" ]; then
            echo "Error: $FLUTTER_DIST directory not found"
            exit 1
          fi
          mkdir -p /tmp/build-output/flutter
          cp -r "$ANGULAR_DIST"/* /tmp/build-output/
          cp -r "$FLUTTER_DIST"/* /tmp/build-output/flutter/
          cp .github/pages-404.html /tmp/build-output/404.html
          git remote set-url origin https://${DEPLOY_TOKEN}@github.com/${{ github.repository }}.git
          git fetch origin gh-pages 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages 2>/dev/null; then
            git checkout -b gh-pages origin/gh-pages 2>/dev/null || git checkout gh-pages
            git pull origin gh-pages || true
          else
            git checkout --orphan gh-pages
            git rm -rf . --quiet || true
          fi
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} + 2>/dev/null || true
          cp -r /tmp/build-output/* .
          touch .nojekyll
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Deploy: $(date +'%Y-%m-%d %H:%M:%S') [skip ci]"
            git push -u origin gh-pages
          else
            echo "No changes to commit"
          fi
